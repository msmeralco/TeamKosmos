<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script src="assets/reel.js"></script>
    <style>
      :root { --cream: #fafaf9; --ink: #111111; --grey: #5f5e5b; --sans: "Helvetica Neue", Helvetica, Arial, sans-serif; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--cream); }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--cream); font-family: var(--sans); color: var(--ink); }
      canvas { position: absolute; left: 0; top: 0; z-index: 4; }
      #mascot { position: absolute; left: 0; top: 0; z-index: 12; transform-origin: 50% 100%; will-change: transform; }
      #rays { position: absolute; left: 700px; top: 100px; width: 520px; height: 520px; z-index: 5; }
      #sol { position: absolute; left: 0; top: 610px; width: 1920px; height: 230px; overflow: hidden; z-index: 12; text-align: center; }
      #sol span { display: block; font: 800 214px/230px var(--sans); letter-spacing: 0.05em; padding-left: 0.05em; color: var(--ink); }
      #tagline { position: absolute; left: 0; top: 862px; width: 1920px; text-align: center; z-index: 12; font: 500 46px var(--sans); letter-spacing: -0.005em; color: var(--grey); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="intro" data-start="0" data-duration="6" data-width="1920" data-height="1080" data-fps="30">
      <audio id="music" src="assets/intro.wav" data-start="0" data-duration="6" data-track-index="9" data-volume="0.9"></audio>
      <canvas id="cBounce" class="clip" data-start="0" data-duration="6" data-track-index="1" width="1920" height="1080"></canvas>
      <svg id="rays" viewBox="-400 -400 800 800"></svg>
      <img id="mascot" src="assets/mascot.svg" width="150" height="150" alt="" />
      <div id="sol"><span id="solText" data-layout-allow-overflow>SOL</span></div>
      <div id="tagline">Your clean energy partner</div>
    </div>

    <script>
      const R = window.Reel, DUR = 6, $ = (id) => document.getElementById(id);
      const ctx = $("cBounce").getContext("2d");
      const SIZE = 150, DROP = 500, GROUND = 0.8, GY = 1080 * GROUND, CX = 960;
      const T_END = R.bounceEnd(DROP);                 // the last little bounce lands here
      const X0 = 560, VX = (CX - X0) / (T_END - R.BOUNCE.t0); // so the sun finishes its bounces in the middle of the frame
      const T_CROUCH = 2.05, T_JUMP = 2.2, T_ARRIVE = 2.9;     // crouch, hop, arrive on the title card
      const TITLE_BOTTOM = 360 + 125, TITLE_SCALE = 250 / SIZE;  // the sun ends 250 px tall, its centre at y = 360

      // sun rays for the title card
      (function () {
        let s = "";
        for (let i = 0; i < 48; i++) {
          const a = (i / 48) * R.TAU, long = i % 2 === 0, r1 = 230, r2 = long ? 372 : 300;
          s += `<line x1="${(Math.cos(a) * r1).toFixed(1)}" y1="${(Math.sin(a) * r1).toFixed(1)}" x2="${(Math.cos(a) * r2).toFixed(1)}" y2="${(Math.sin(a) * r2).toFixed(1)}" stroke="${long ? "#ea580c" : "#f4b92f"}" stroke-width="${long ? 5 : 3}" stroke-linecap="round" opacity="${long ? 0.9 : 0.7}"/>`;
        }
        $("rays").innerHTML = `<g id="raysG">${s}</g>`;
      })();

      /* One function decides every frame: the bounce, then the crouch and hop up to the title card. */
      function update(t) {
        t = Math.min(DUR, Math.max(0, t));
        const fade = 1 - R.E.inOutSine(R.prog(t, T_CROUCH, T_CROUCH + 0.55)); // the ground and dotted paths fade as the sun leaves
        const b = R.bounceScene(ctx, 1920, 1080, Math.min(t, T_CROUCH), { size: SIZE, drop: DROP, ground: GROUND, x0: X0, vx: VX, light: true, labels: false, alpha: fade, span: 0.88 });
        if (fade <= 0) ctx.clearRect(0, 0, 1920, 1080);
        let x = b.x, bottom = b.bottom, sx = b.sx, sy = b.sy, tilt = b.tilt, k = 1;
        if (t >= T_CROUCH) {
          x = CX; bottom = GY; sx = 1; sy = 1; tilt = 0;
          const c = R.prog(t, T_CROUCH, T_JUMP);                    // crouch: squash down before the jump
          if (t < T_JUMP) { const q = Math.sin((Math.PI / 2) * c) * 0.3; sy = 1 - q; sx = 1 + q * 0.8; }
          else {
            const u = R.prog(t, T_JUMP, T_ARRIVE), e = R.E.outCubic(u);
            bottom = R.lerp(GY, TITLE_BOTTOM, e) - Math.sin(Math.PI * Math.min(1, u * 1.15)) * 70;
            k = R.lerp(1, TITLE_SCALE, R.E.outBack(R.prog(t, T_JUMP, T_ARRIVE + 0.1)));
            tilt = R.E.outCubic(u) * R.TAU;                         // one full spin on the way up
            const st = Math.sin(Math.PI * Math.min(1, u * 1.2)) * 0.16; sy = 1 + st; sx = 1 / Math.sqrt(sy);
            if (t > T_ARRIVE) { const q = Math.sin(Math.PI * R.prog(t, T_ARRIVE, T_ARRIVE + 0.18)) * 0.12; sy = 1 - q; sx = 1 + q * 0.9; } // lands softly
          }
          if (t > T_ARRIVE + 0.2) bottom -= Math.sin((t - T_ARRIVE - 0.2) * 2.2) * 7;                 // a gentle float
        }
        $("mascot").style.transform = `translate(${x - SIZE / 2}px, ${bottom - SIZE}px) rotate(${tilt}rad) scale(${sx * k}, ${sy * k})`;
      }

      const tl = gsap.timeline({ paused: true }), clock = { t: 0 };
      tl.fromTo(clock, { t: 0 }, { t: DUR, duration: DUR, ease: "none", immediateRender: false, onUpdate: () => update(clock.t) }, 0);
      tl.fromTo("#rays", { scale: 0.45, opacity: 0, rotation: -30 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.9, ease: "power3.out" }, T_ARRIVE - 0.25);
      tl.to("#raysG", { rotation: 40, svgOrigin: "0 0", duration: 3.2, ease: "none" }, T_ARRIVE - 0.25);
      tl.fromTo("#solText", { yPercent: 105 }, { yPercent: 0, duration: 0.6, ease: "power4.out" }, T_ARRIVE + 0.05);
      tl.fromTo("#tagline", { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, T_ARRIVE + 0.5);

      window.__timelines = window.__timelines || {};
      const img = $("mascot");
      Promise.all([img.decode ? img.decode().catch(() => {}) : Promise.resolve(), document.fonts ? document.fonts.ready : Promise.resolve()]).then(() => {
        update(0); window.__timelines["intro"] = tl; tl.seek(0);
      });
    </script>
  </body>
</html>
